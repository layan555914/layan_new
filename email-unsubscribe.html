<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102746">
  <title>إلغاء إشعارات البريد | أسيوط عقار</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{font-family:Tahoma,Arial,sans-serif;background:#f5f7fa;color:#102746}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
    main{width:min(100%,520px);background:#fff;border:1px solid #e1e6ed;border-radius:16px;padding:28px;box-sizing:border-box;text-align:center}
    h1{font-size:23px;margin:0 0 12px}p{line-height:1.9;color:#526174}a{color:#102746;font-weight:700}
    .mark{width:52px;height:5px;background:#C8963E;border-radius:8px;margin:0 auto 20px}
  </style>
</head>
<body>
  <main>
    <div class="mark"></div>
    <h1>إدارة اشتراك البريد</h1>
    <p id="message" role="status" aria-live="polite">جارٍ تنفيذ طلب إلغاء الاشتراك...</p>
    <p><a href="./">العودة إلى أسيوط عقار</a></p>
  </main>
  <script src="./config.js"></script>
  <script>
    (async function () {
      const message = document.getElementById("message");
      const token = new URLSearchParams(location.search).get("token") || "";
      const config = window.LAYAN_CONFIG || {};
      const base = String(config.SUPABASE_URL || "").replace(/\/$/, "");
      const key = config.SUPABASE_PUBLISHABLE_KEY || "";
      if (!token || !base || !key) {
        message.textContent = "رابط إلغاء الاشتراك غير مكتمل. يمكنك التواصل مع إدارة أسيوط عقار للمساعدة.";
        return;
      }
      try {
        const response = await fetch(base + "/functions/v1/email-notifications", {
          method: "POST",
          headers: { apikey: key, "Content-Type": "application/json" },
          body: JSON.stringify({ action: "unsubscribe", token })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "تعذر تنفيذ الطلب.");
        message.textContent = "تم إلغاء اشتراكك في إشعارات البريد الإلكتروني. لن تصلك رسائل العروض الجديدة بعد الآن.";
      } catch (error) {
        message.textContent = error.message || "تعذر إلغاء الاشتراك الآن. حاول مرة أخرى.";
      }
    })();
  </script>
</body>
</html>
