<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2B211B">
  <title>تعيين كلمة مرور جديدة | ASYUT AQAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="./config.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#FBF7F3;color:#342922;font-family:"Readex Pro","Alexandria",Tahoma,Arial,sans-serif}
    main{width:min(100%,480px);background:#fff;border:1px solid #F2EAE1;border-radius:22px;padding:28px;box-shadow:0 18px 55px #10274614}
    .brand{text-align:center;margin-bottom:22px}.brand strong{display:block;font-size:25px;letter-spacing:1px}.brand span{display:block;margin-top:5px;color:#905533;font-size:14px}
    h1{font-size:23px;margin:0 0 10px}p{line-height:1.8;color:#796759;margin:0 0 18px}
    label{display:block;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #DCD4CE;border-radius:10px;font:inherit}
    button{width:100%;margin-top:18px;border:0;border-radius:10px;padding:14px;background:#BC6F42;color:#342922;font:inherit;font-weight:800;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}#status{margin-top:16px;padding:12px;border-radius:10px;background:#FBF7F3;white-space:pre-wrap}a{color:#905533}
  </style>
  <link rel="icon" href="./assets/brand/favicon-32.png?v=20261105-2" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./assets/brand/apple-touch-icon.png?v=20261105-2">
  <link rel="stylesheet" href="./assets/theme/asyut-premium.css?v=20261105-5">
</head>
<body>
<main>
  <div class="brand"><strong>ASYUT AQAR</strong><span>أسيوط عقار</span></div>
  <h1>تعيين كلمة مرور جديدة</h1>
  <p>اكتب كلمة مرور جديدة لحسابك. لا تشارك رابط الاستعادة أو رموزه مع أي شخص.</p>
  <form id="resetForm">
    <label for="password">كلمة المرور الجديدة</label>
    <input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="8 أحرف على الأقل">
    <label for="confirmPassword">تأكيد كلمة المرور</label>
    <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="اكتبها مرة أخرى">
    <button id="submitBtn" type="submit">حفظ كلمة المرور الجديدة</button>
  </form>
  <div id="status" role="status" aria-live="polite">جارٍ التحقق من رابط الاستعادة...</div>
  <p style="margin-top:18px;font-size:13px"><a href="./">العودة إلى منصة أسيوط عقار</a></p>
</main>
<script>
(() => {
  const cfg = window.LAYAN_CONFIG || {};
  const base = String(cfg.SUPABASE_URL || "").replace(/\/$/, "");
  const key = cfg.SUPABASE_PUBLISHABLE_KEY || "";
  const form = document.getElementById("resetForm");
  const status = document.getElementById("status");
  const button = document.getElementById("submitBtn");
  const params = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
  const recoveryPkceStorageKey = "layanRecoveryCodeVerifier:" + new URL(base).hostname.split(".")[0];
  let accessToken = hash.get("access_token") || params.get("access_token") || "";
  let verified = false;
  const say = (message) => { status.textContent = message; };
  async function readResponse(response) {
    let data = {};
    try { data = await response.json(); } catch (_) {}
    if (!response.ok) throw new Error(data.msg || data.message || data.error_description || data.error || "تعذر التحقق من الرابط.");
    return data;
  }
  async function init() {
    if (!base || !key) { say("إعدادات الاتصال غير مكتملة. تواصل مع إدارة أسيوط عقار."); button.disabled = true; return; }
    if (hash.get("error") || hash.get("error_description") || params.get("error") || params.get("error_description") || params.get("error_code")) {
      say("رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رسالة استعادة جديدة.");
      button.disabled = true; return;
    }
    const authCode = params.get("code") || hash.get("code") || "";
    if (authCode) {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(recoveryPkceStorageKey) || "null"); } catch (_) {}
      const verifier = typeof saved?.code_verifier === "string" ? saved.code_verifier : "";
      const createdAt = Number(saved?.created_at || 0);
      const verifierFresh = createdAt > 0 && Date.now() - createdAt >= 0 && Date.now() - createdAt < 60 * 60 * 1000;
      if (!verifier || !verifierFresh) {
        try { localStorage.removeItem(recoveryPkceStorageKey); } catch (_) {}
        history.replaceState(null, document.title, location.pathname);
        say("وصل رابط الاستعادة بصيغة آمنة، لكن بيانات التحقق الخاصة بالمتصفح غير موجودة أو انتهت. اطلب رسالة جديدة وافتحها في نفس المتصفح الذي طلبت منه الاستعادة.");
        button.disabled = true;
        return;
      }
      // Remove the one-time authorization code from the address bar before exchanging it.
      history.replaceState(null, document.title, location.pathname);
      try {
        const response = await fetch(base + "/auth/v1/token?grant_type=pkce", {
          method: "POST",
          headers: { apikey: key, "Content-Type": "application/json" },
          body: JSON.stringify({ auth_code: authCode, code_verifier: verifier })
        });
        const data = await readResponse(response);
        accessToken = data.access_token || "";
        if (!accessToken) throw new Error("لم يرجع خادم المصادقة جلسة استعادة صالحة.");
        verified = true;
        try { localStorage.removeItem(recoveryPkceStorageKey); } catch (_) {}
        say("تم التحقق من رابط الاستعادة الآمن. اكتب كلمة المرور الجديدة.");
        return;
      } catch (_) {
        try { localStorage.removeItem(recoveryPkceStorageKey); } catch (_) {}
        say("تعذر التحقق من رابط الاستعادة. قد يكون الرمز انتهت صلاحيته أو استُخدم من قبل. اطلب رسالة استعادة جديدة وافتحها في نفس المتصفح.");
        button.disabled = true;
        return;
      }
    }
    if (params.get("token_hash") && params.get("type") === "recovery") {
      try {
        const response = await fetch(base + "/auth/v1/verify", {
          method: "POST",
          headers: { apikey: key, "Content-Type": "application/json" },
          body: JSON.stringify({ token_hash: params.get("token_hash"), type: "recovery" })
        });
        const data = await readResponse(response);
        accessToken = data.access_token || "";
        if (!accessToken) throw new Error("لم يتم إنشاء جلسة الاستعادة.");
        verified = true;
        history.replaceState(null, document.title, location.pathname);
        say("تم التحقق من الرابط. اكتب كلمة المرور الجديدة.");
        return;
      } catch (_) {
        say("رابط الاستعادة غير صالح أو انتهت صلاحيته. ارجع إلى صفحة الدخول واطلب رسالة جديدة.");
        button.disabled = true; return;
      }
    }
    if (accessToken && (hash.get("type") === "recovery" || params.get("type") === "recovery")) {
      try {
        const response = await fetch(base + "/auth/v1/user", { headers: { apikey: key, Authorization: "Bearer " + accessToken } });
        await readResponse(response);
        verified = true;
        history.replaceState(null, document.title, location.pathname);
        say("تم التحقق من الرابط. اكتب كلمة المرور الجديدة.");
        return;
      } catch (_) {}
    }
    say("الرابط الذي فتحته لا يحتوي على رمز استعادة صالح. افتح أحدث رسالة استعادة من بريدك واضغط زر الاستعادة داخل الرسالة، ولا تفتح صفحة الموقع مباشرة. إذا استمرت المشكلة، أرسل طلب استعادة جديدًا لأن الرابط قد يكون منتهي الصلاحية.");
    button.disabled = true;
  }
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!verified || !accessToken) { say("رابط الاستعادة غير صالح. اطلب رسالة جديدة."); return; }
    const password = document.getElementById("password").value;
    const confirmation = document.getElementById("confirmPassword").value;
    if (password.length < 8) { say("كلمة المرور يجب أن تكون 8 أحرف على الأقل."); return; }
    if (password !== confirmation) { say("كلمتا المرور غير متطابقتين."); return; }
    button.disabled = true; say("جارٍ حفظ كلمة المرور...");
    try {
      const response = await fetch(base + "/auth/v1/user", {
        method: "PUT",
        headers: { apikey: key, Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });
      await readResponse(response);
      accessToken = "";
      say("تم تغيير كلمة المرور بنجاح. ارجع إلى المنصة وسجّل الدخول باستخدام كلمة المرور الجديدة.");
      form.reset();
      form.hidden = true;
    } catch (_) {
      say("لم نتمكن من تغيير كلمة المرور. قد يكون الرابط انتهت صلاحيته؛ اطلب رسالة استعادة جديدة.");
      button.disabled = false;
    }
  });
  init();
})();
</script>
</body>
</html>
