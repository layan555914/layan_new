name: Validate ASYUT AQAR platform

on:
  push:
    branches:
      - main
      - feature/company-directory-claims
      - feat/buyer-notifications-all-and-matched
      - feature/directory-browser-improvements-20261102
      - feature/directory-admin-console-20261103
      - fix/directory-admin-mobile-test-race-20261103
      - fix/directory-admin-visible-nav-buttons-20261103
      - restore/asyut-aqar-full-platform-20261101
      - feature/asyut-real-estate-directory
      - fix/directory-cache-bust-v107
      - fix/directory-data-cache-v108
      - fix/directory-opportunity-source-links
      - research/directory-assiut-batch-20261102
      - fix/company-profile-security-flow-20261104
      - fix/auth-recovery-pkce-flow-20261104
      - fix/signup-confirmation-pkce-20261104
      - feature/assyut-directory-maps-taxonomy-refresh-20261104
      - feature/verified-directory-map-coordinates-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out restoration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Deno for Supabase Edge Function type checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)

      - name: Type-check Supabase Edge Functions
        run: |
          deno check --no-lock             supabase/functions/asyut-admin/index.ts             supabase/functions/asyut-push/index.ts

      - name: Validate pages, local assets, PWA shell and auth UI contracts
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const errors = [];
          const ignored = new Set(['.git', 'node_modules', '.vercel', 'email-templates']);

          function walk(directory) {
            const files = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.isDirectory()) {
                if (!ignored.has(entry.name)) files.push(...walk(path.join(directory, entry.name)));
              } else if (entry.isFile()) {
                files.push(path.join(directory, entry.name).replaceAll(path.sep, '/'));
              }
            }
            return files;
          }

          const allFiles = walk('.');

          // CSS bundles (assets/build/*.min.css) must match their source stylesheets.
          {
            const crypto = require('node:crypto');
            const buildSource = fs.readFileSync('scripts/build-css.mjs', 'utf8');
            const bundleBlock = buildSource.match(/export const BUNDLES = \{([\s\S]*?)\n\};/);
            const theme = buildSource.match(/const THEME = "([^"]+)"/)[1];
            for (const line of (bundleBlock ? bundleBlock[1].split('\n') : [])) {
              const m = line.match(/^\s*(\w+):\s*\[(.*)\]/);
              if (!m) continue;
              const files = m[2].split(',').map(x => x.trim()).map(x => x === 'THEME' ? theme : x.replace(/^"|"$/g, ''));
              const hash = crypto.createHash('sha256');
              for (const file of files) hash.update(file + '\n' + fs.readFileSync(file, 'utf8') + '\n');
              const expected = hash.digest('hex').slice(0, 16);
              const bundle = 'assets/build/' + m[1] + '.min.css';
              const header = fs.existsSync(bundle) ? fs.readFileSync(bundle, 'utf8').split('\n', 1)[0] : '';
              if (!header.includes('sources:' + expected)) errors.push(bundle + ' is out of date: run node scripts/build-css.mjs');
            }
          }
          const htmlFiles = allFiles.filter(file => file.endsWith('.html'));
          const cssFiles = allFiles.filter(file => file.endsWith('.css'));
          if (!htmlFiles.includes('index.html')) errors.push('index.html is missing');
          if (!htmlFiles.includes('admin.html')) errors.push('admin.html is missing');
          if (!htmlFiles.includes('property.html')) errors.push('property.html is missing');

          // Generated listing pages (ads/<id>.html) use <base href="/"> so their links resolve from the site root.
          const baseCache = new Map();
          function rootBased(file) {
            if (!file.endsWith('.html')) return false;
            if (!baseCache.has(file)) baseCache.set(file, /<base href="\/">/.test(fs.readFileSync(file, 'utf8')));
            return baseCache.get(file);
          }

          function checkLocalReference(file, rawReference) {
            let ref = String(rawReference || '').trim();
            if (!ref || /^(?:[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(ref)) return;
            ref = ref.split(/[?#]/, 1)[0];
            if (!ref) return;
            let target = ref.startsWith('/')
              ? ref.slice(1)
              : path.posix.normalize(path.posix.join(rootBased(file) ? '.' : path.posix.dirname(file), ref));
            if (target === '' || target === '.' || target.endsWith('/')) target = path.posix.join(target, 'index.html');
            if (!fs.existsSync(target)) errors.push(file + ' -> ' + rawReference + ' (missing ' + target + ')');
          }

          for (const file of htmlFiles) {
            const source = fs.readFileSync(file, 'utf8');
            if (!/\blang=["']ar["']/i.test(source)) errors.push(file + ' is missing lang="ar"');
            if (!/\bdir=["']rtl["']/i.test(source)) errors.push(file + ' is missing dir="rtl"');
            for (const match of source.matchAll(/\b(?:src|href|poster)=["']([^"']+)["']/gi)) {
              checkLocalReference(file, match[1]);
            }
          }

          for (const file of cssFiles) {
            const source = fs.readFileSync(file, 'utf8');
            for (const match of source.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/gi)) {
              checkLocalReference(file, match[1]);
            }
          }

          try {
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (!manifest.name || !manifest.start_url || !manifest.scope || !Array.isArray(manifest.icons) || !manifest.icons.length) {
              errors.push('manifest.json is missing required PWA fields');
            }
            for (const icon of manifest.icons || []) checkLocalReference('manifest.json', icon.src);
          } catch (error) {
            errors.push('manifest.json: ' + error.message);
          }

          try {
            const sw = fs.readFileSync('sw.js', 'utf8');
            const match = sw.match(/const APP_SHELL = \[([\s\S]*?)\];/);
            if (!match) errors.push('sw.js: APP_SHELL list not found');
            else {
              for (const item of match[1].matchAll(/["']([^"']+)["']/g)) {
                checkLocalReference('sw.js', item[1]);
              }
            }
          } catch (error) {
            errors.push('sw.js: ' + error.message);
          }

          const vm = require('node:vm');
          const configSource = fs.readFileSync('config.js', 'utf8');
          const directoryJs = fs.readFileSync('directory.js', 'utf8');
          const directoryHtml = fs.readFileSync('directory.html', 'utf8');
          const directorySpecs = fs.readFileSync('tests/e2e/directory.spec.mjs', 'utf8');
          const directoryAdminJs = fs.readFileSync('directory-admin.js', 'utf8');
          const mapCoordinateMigration = fs.readFileSync('supabase/migrations/20261104051622_verified_directory_map_coordinates.sql', 'utf8');
          const mapTriggerFixMigration = fs.readFileSync('supabase/migrations/20261104051952_fix_directory_map_location_trigger_row_shape.sql', 'utf8');

          function configForHost(hostname) {
            const context = { window: { location: { hostname } } };
            vm.runInNewContext(configSource, context, { timeout: 1000 });
            return context.window.LAYAN_CONFIG;
          }
          const productionConfig = configForHost('www.asyutq.com');
          const apexConfig = configForHost('asyutq.com');
          if (apexConfig.ENVIRONMENT !== 'production') errors.push('asyutq.com must use the production Supabase project');
          const previewConfig = configForHost('maps-preview.vercel.app');
          if (productionConfig.ENVIRONMENT !== 'production' ||
              productionConfig.SUPABASE_URL !== 'https://ebyhwqkmhxbgocngpqfe.supabase.co') {
            errors.push('Production domain must stay connected to the production Supabase project');
          }
          if (previewConfig.ENVIRONMENT !== 'test' ||
              previewConfig.SUPABASE_URL !== 'https://wisnmlbefdrkcbbqvdlg.supabase.co') {
            errors.push('Vercel previews and other non-production hosts must use isolated TEST Supabase');
          }
          if (!directoryHtml.includes('id="directoryMapArea"') ||
              !directoryHtml.includes('id="directoryMapFrame"') ||
              !directoryHtml.includes('id="directoryMapOpen"') ||
              !directoryJs.includes('function mapAreaOptions()') ||
              !directoryJs.includes('encodeURIComponent(query)') ||
              !directorySpecs.includes('directory map searches the selected published area')) {
            errors.push('Directory map must use published-area selection and test its approximate map search behavior');
          }
          if (!mapCoordinateMigration.includes('location_source_id') ||
              !mapCoordinateMigration.includes("confidence_level NOT IN ('high','official')") ||
              !mapCoordinateMigration.includes('location_public') ||
              !mapCoordinateMigration.includes('location_verified_at') ||
              !mapCoordinateMigration.includes('directory_guard_public_map_source')) {
            errors.push('Verified map coordinates must require a trusted public source, verification date and explicit publication approval');
          }
          if (!mapTriggerFixMigration.includes("TG_TABLE_NAME = 'directory_areas'") ||
              !directoryAdminJs.includes('function mapLocationFields(type, record)') ||
              !directoryAdminJs.includes('function prepareMapLocationPatch(type, patch)') ||
              !directoryJs.includes('function validPublicMapPoint(record)') ||
              !directorySpecs.includes('only public points backed by an official source')) {
            errors.push('Admin and public map flows must expose only source-verified map coordinates');
          }
          const app = fs.readFileSync('app.js', 'utf8');
          const marketplace = fs.readFileSync('marketplace.js', 'utf8');
          const sponsor = fs.readFileSync('sponsor.js', 'utf8');
          // vm, configSource, configForHost and productionConfig are declared above (directory map checks).
          const privateCompanyMigration = fs.readFileSync('supabase/migrations/20261104045129_move_company_profile_definers_to_private.sql', 'utf8');
          const branchPreviewConfig = configForHost('preview-branch.vercel.app');
          const localConfig = configForHost('localhost');
          if (productionConfig.ENVIRONMENT !== 'production' ||
              productionConfig.SUPABASE_URL !== 'https://ebyhwqkmhxbgocngpqfe.supabase.co') {
            errors.push('The production domain must remain pinned to the production Supabase project');
          }
          if (branchPreviewConfig.ENVIRONMENT !== 'test' ||
              branchPreviewConfig.SUPABASE_URL !== 'https://wisnmlbefdrkcbbqvdlg.supabase.co' ||
              localConfig.ENVIRONMENT !== 'test') {
            errors.push('Vercel previews and local hosts must use the isolated TEST Supabase project');
          }
          if (!privateCompanyMigration.includes('SECURITY INVOKER') ||
              !privateCompanyMigration.includes('private.layan_submit_company_profile') ||
              !privateCompanyMigration.includes('private.layan_review_company_profile')) {
            errors.push('Privileged company profile functions must be isolated behind private SECURITY DEFINER helpers');
          }

          if (!/forgotButton\.hidden\s*=\s*mode\s*!==\s*["']login["']/.test(app)) {
            errors.push('Main auth dialog must hide password recovery outside login mode');
          }
          if (!/\$\(["']forgotPassword["']\)\.hidden\s*=\s*signup/.test(marketplace)) {
            errors.push('Marketplace auth dialog must hide password recovery during signup');
          }
          if (/images\.pexels\.com/.test(sponsor)) {
            errors.push('Sponsor cards must not use unrelated generic stock photos as advertiser images');
          }

          const authClientJs = fs.readFileSync('gubabase.js', 'utf8');
          const resetPasswordHtml = fs.readFileSync('reset-password.html', 'utf8');
          const resetPasswordTests = fs.readFileSync('tests/e2e/reset-password.spec.mjs', 'utf8');
          const signupClientTests = fs.readFileSync('tests/e2e/signup-confirmation.spec.mjs', 'utf8');
          const appAuthJs = fs.readFileSync('app.js', 'utf8');

          const signupTests = fs.readFileSync('tests/e2e/signup-confirmation.spec.mjs', 'utf8');
          if (!authClientJs.includes('SIGNUP_PKCE_STORAGE_KEY') ||
              !authClientJs.includes('code_challenge: pkce.codeChallenge') ||
              !authClientJs.includes('code_challenge_method: "s256"')) {
            errors.push('Email signups must send an S256 PKCE challenge and preserve its verifier');
          }
          if (!authClientJs.includes('resend?redirect_to=') ||
              !authClientJs.includes('token?grant_type=pkce') ||
              !authClientJs.includes('emitAuthCallback') ||
              !appAuthJs.includes('window.LAYAN_AUTH_CALLBACK_RESULT') ||
              !appAuthJs.includes('handleAuthCallback({ detail: window.LAYAN_AUTH_CALLBACK_RESULT })')) {
            errors.push('Signup confirmation must use the correct resend redirect and replay PKCE callback results to the UI');
          }
          if (!signupClientTests.includes('signup sends an S256 PKCE challenge') ||
              !signupClientTests.includes('email confirmation PKCE code creates a session') ||
              !signupClientTests.includes('resend confirmation retains the original signup verifier') ||
              !signupClientTests.includes('callback results are replayed') ||
              !signupClientTests.includes('legacy implicit email-confirmation callbacks remain supported')) {
            errors.push('Signup confirmation PKCE browser regression tests are incomplete');
          }
          if (!authClientJs.includes('resend?redirect_to=') ||
              authClientJs.includes('options: { emailRedirectTo: redirectTo }')) {
            errors.push('Signup confirmation resend must use the Auth REST redirect_to query and retain the original verifier');
          }
          if (!authClientJs.includes('token?grant_type=pkce') ||
              !authClientJs.includes('SIGNUP_PKCE_STORAGE_KEY') ||
              !authClientJs.includes('LAYAN_AUTH_CALLBACK_RESULT')) {
            errors.push('Signup confirmation callback must exchange PKCE code and expose the result to late UI listeners');
          }
          if (!signupTests.includes('signup sends an S256 PKCE challenge') ||
              !signupTests.includes('email confirmation PKCE code creates a session') ||
              !signupTests.includes('resend confirmation retains the original signup verifier') ||
              !signupTests.includes('legacy implicit email-confirmation callbacks remain supported')) {
            errors.push('Signup confirmation PKCE browser regression tests are incomplete');
          }


          if (!authClientJs.includes('code_challenge_method: "s256"') ||
              !authClientJs.includes('code_challenge: codeChallenge') ||
              !authClientJs.includes('RECOVERY_PKCE_STORAGE_KEY')) {
            errors.push('Password recovery requests must create and send a PKCE challenge and preserve its verifier');
          }
          if (!resetPasswordHtml.includes('token?grant_type=pkce') ||
              !resetPasswordHtml.includes('auth_code: authCode') ||
              !resetPasswordHtml.includes('code_verifier: verifier') ||
              !resetPasswordHtml.includes('token_hash')) {
            errors.push('Password recovery callback must exchange PKCE codes and retain legacy token_hash support');
          }
          if (!resetPasswordTests.includes('password recovery request sends a PKCE challenge') ||
              !resetPasswordTests.includes('PKCE recovery callback exchanges the one-time code') ||
              !resetPasswordTests.includes('legacy token_hash recovery links remain supported')) {
            errors.push('Password recovery browser regression tests are incomplete');
          }

          const companiesJs = fs.readFileSync('companies.js', 'utf8');
          const companyProfileJs = fs.readFileSync('company-profile.js', 'utf8');
          const adminJs = fs.readFileSync('admin.js', 'utf8');
          const myListingsJs = fs.readFileSync('my-listings.js', 'utf8');
          const companySecurityMigration = fs.readFileSync('supabase/migrations/20261104042819_company_profiles_rpc_access_hardening.sql', 'utf8');
          const companyViewMigration = fs.readFileSync('supabase/migrations/20261104042906_company_profiles_public_view_column_grants.sql', 'utf8');
          if (!companiesJs.includes('rpc/layan_company_owner_profile') || !companiesJs.includes('rpc/layan_submit_company_profile')) {
            errors.push('Company owner reads and submissions must use scoped RPC functions');
          }
          if (companiesJs.includes('company_profiles?')) {
            errors.push('Company owner UI must not query company_profiles directly');
          }
          if (!myListingsJs.includes('rpc/layan_company_owner_profile') || myListingsJs.includes('company_profiles?')) {
            errors.push('My Listings must load company requests via the owner-scoped RPC, not the base table');
          }
          const requiredCompanyProfileFields = ['address','phone','whatsapp','website','logo_url','gallery_urls','projects'];
          if (!companyProfileJs.includes('company_profiles_public?select=') ||
              requiredCompanyProfileFields.some(field => !companyProfileJs.includes(field))) {
            errors.push('Public company profile must request contact and portfolio fields from the approved view');
          }
          if (!adminJs.includes('rpc/layan_admin_list_company_profiles') ||
              !adminJs.includes('rpc/layan_review_company_profile') ||
              !adminJs.includes('rpc/layan_admin_pending_company_profile_count') ||
              adminJs.includes('/rest/v1/company_profiles?')) {
            errors.push('Company administration must use admin RPCs, not direct base-table reads or writes');
          }
          if (!companySecurityMigration.includes('REVOKE ALL PRIVILEGES ON TABLE public.company_profiles') ||
              !companySecurityMigration.includes('layan_submit_company_profile') ||
              !companySecurityMigration.includes('auth.uid()')) {
            errors.push('Company profile hardening migration is missing owner-scoped access controls');
          }
          if (!companyViewMigration.includes('security_invoker = true') ||
              !companyViewMigration.includes('GRANT SELECT (') ||
              !companyViewMigration.includes("USING (status = 'active')")) {
            errors.push('Public company view must retain invoker security, column-only grants and active-only RLS');
          }

          const directoryAdmin = fs.readFileSync('directory-admin.html', 'utf8');
          if (!/\.dir-admin-head \.btn-outline\s*\{[^}]*color:\s*#fffdf7\s*!important/i.test(directoryAdmin)) {
            errors.push('Directory admin header navigation links must retain readable light text on the navy header');
          }
          if (!/\.dir-admin-login button\[type=["']submit["']\]\s*\{[^}]*display:\s*flex\s*!important[^}]*visibility:\s*visible\s*!important[^}]*opacity:\s*1\s*!important/i.test(directoryAdmin)) {
            errors.push('Directory admin login submit button must be explicitly visible');
          }

          if (fs.existsSync('CNAME')) {
            const cname = fs.readFileSync('CNAME', 'utf8').trim();
            if (cname !== 'www.asyutq.com') errors.push('Unexpected CNAME value: ' + cname);
          } else {
            errors.push('CNAME file is missing');
          }

          if (errors.length) {
            console.error('Validation failed:');
            for (const error of errors) console.error(' - ' + error);
            process.exit(1);
          }
          console.log('Validation passed: JavaScript, Edge Function types, RTL pages, local assets, PWA shell, auth mode UI, sponsor imagery and CNAME.');
          NODE

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.64.1

      - name: Install Chromium for browser journey tests
        run: npx playwright install --with-deps chromium

      - name: Run customer and admin browser journey against mocked Supabase
        env:
          CI: "true"
        run: npx playwright test

      - name: Verify live Supabase reads and anonymous permission boundaries
        run: node tests/e2e/live-supabase-readonly.mjs
