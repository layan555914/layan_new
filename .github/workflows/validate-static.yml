name: Validate ASYUT AQAR platform

on:
  push:
    branches:
      - main
      - feature/directory-browser-improvements-20261102
      - feature/directory-admin-console-20261103
      - fix/directory-admin-mobile-test-race-20261103
      - fix/directory-admin-visible-nav-buttons-20261103
      - restore/asyut-aqar-full-platform-20261101
      - review/directory-atomic-audit-20261103
      - feature/asyut-real-estate-directory
      - fix/directory-cache-bust-v107
      - fix/directory-data-cache-v108
      - fix/directory-opportunity-source-links
      - research/directory-assiut-batch-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out restoration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Deno for Supabase Edge Function type checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)

      - name: Type-check Supabase Edge Functions
        run: |
          deno check --no-lock             supabase/functions/asyut-admin/index.ts             supabase/functions/asyut-push/index.ts

      - name: Validate pages, local assets, PWA shell and auth UI contracts
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const errors = [];
          const ignored = new Set(['.git', 'node_modules', '.vercel']);

          function walk(directory) {
            const files = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.isDirectory()) {
                if (!ignored.has(entry.name)) files.push(...walk(path.join(directory, entry.name)));
              } else if (entry.isFile()) {
                files.push(path.join(directory, entry.name).replaceAll(path.sep, '/'));
              }
            }
            return files;
          }

          const allFiles = walk('.');
          const htmlFiles = allFiles.filter(file => file.endsWith('.html'));
          const cssFiles = allFiles.filter(file => file.endsWith('.css'));
          if (!htmlFiles.includes('index.html')) errors.push('index.html is missing');
          if (!htmlFiles.includes('admin.html')) errors.push('admin.html is missing');
          if (!htmlFiles.includes('property.html')) errors.push('property.html is missing');

          function checkLocalReference(file, rawReference) {
            let ref = String(rawReference || '').trim();
            if (!ref || /^(?:[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(ref)) return;
            ref = ref.split(/[?#]/, 1)[0];
            if (!ref) return;
            let target = ref.startsWith('/')
              ? ref.slice(1)
              : path.posix.normalize(path.posix.join(path.posix.dirname(file), ref));
            if (target === '.' || target.endsWith('/')) target = path.posix.join(target, 'index.html');
            if (!fs.existsSync(target)) errors.push(file + ' -> ' + rawReference + ' (missing ' + target + ')');
          }

          for (const file of htmlFiles) {
            const source = fs.readFileSync(file, 'utf8');
            if (!/\blang=["']ar["']/i.test(source)) errors.push(file + ' is missing lang="ar"');
            if (!/\bdir=["']rtl["']/i.test(source)) errors.push(file + ' is missing dir="rtl"');
            for (const match of source.matchAll(/\b(?:src|href|poster)=["']([^"']+)["']/gi)) {
              checkLocalReference(file, match[1]);
            }
          }

          for (const file of cssFiles) {
            const source = fs.readFileSync(file, 'utf8');
            for (const match of source.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/gi)) {
              checkLocalReference(file, match[1]);
            }
          }

          try {
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (!manifest.name || !manifest.start_url || !manifest.scope || !Array.isArray(manifest.icons) || !manifest.icons.length) {
              errors.push('manifest.json is missing required PWA fields');
            }
            for (const icon of manifest.icons || []) checkLocalReference('manifest.json', icon.src);
          } catch (error) {
            errors.push('manifest.json: ' + error.message);
          }

          try {
            const sw = fs.readFileSync('sw.js', 'utf8');
            const match = sw.match(/const APP_SHELL = \[([\s\S]*?)\];/);
            if (!match) errors.push('sw.js: APP_SHELL list not found');
            else {
              for (const item of match[1].matchAll(/["']([^"']+)["']/g)) {
                checkLocalReference('sw.js', item[1]);
              }
            }
          } catch (error) {
            errors.push('sw.js: ' + error.message);
          }

          const app = fs.readFileSync('app.js', 'utf8');
          const marketplace = fs.readFileSync('marketplace.js', 'utf8');
          const sponsor = fs.readFileSync('sponsor.js', 'utf8');
          if (!/forgotButton\.hidden\s*=\s*mode\s*!==\s*["']login["']/.test(app)) {
            errors.push('Main auth dialog must hide password recovery outside login mode');
          }
          if (!/\$\(["']forgotPassword["']\)\.hidden\s*=\s*signup/.test(marketplace)) {
            errors.push('Marketplace auth dialog must hide password recovery during signup');
          }
          if (/images\.pexels\.com/.test(sponsor)) {
            errors.push('Sponsor cards must not use unrelated generic stock photos as advertiser images');
          }

          const directoryAdmin = fs.readFileSync('directory-admin.html', 'utf8');
          if (!/\.dir-admin-head \.btn-outline\s*\{[^}]*color:\s*#fffdf7\s*!important/i.test(directoryAdmin)) {
            errors.push('Directory admin header navigation links must retain readable light text on the navy header');
          }
          if (!/\.dir-admin-login button\[type=["']submit["']\]\s*\{[^}]*display:\s*flex\s*!important[^}]*visibility:\s*visible\s*!important[^}]*opacity:\s*1\s*!important/i.test(directoryAdmin)) {
            errors.push('Directory admin login submit button must be explicitly visible');
          }

          if (fs.existsSync('CNAME')) {
            const cname = fs.readFileSync('CNAME', 'utf8').trim();
            if (cname !== 'layan-eg.com') errors.push('Unexpected CNAME value: ' + cname);
          } else {
            errors.push('CNAME file is missing');
          }

          if (errors.length) {
            console.error('Validation failed:');
            for (const error of errors) console.error(' - ' + error);
            process.exit(1);
          }
          console.log('Validation passed: JavaScript, Edge Function types, RTL pages, local assets, PWA shell, auth mode UI, sponsor imagery and CNAME.');
          NODE

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.64.1

      - name: Install Chromium for browser journey tests
        run: npx playwright install --with-deps chromium

      - name: Run customer and admin browser journey against mocked Supabase
        env:
          CI: "true"
        run: npx playwright test

      - name: Verify live Supabase reads and anonymous permission boundaries
        run: node tests/e2e/live-supabase-readonly.mjs
