name: Generate CRM migration filename with Supabase CLI

on:
  push:
    branches:
      - feature/crm-on-current-main-20261121
    paths:
      - .github/workflows/generate-crm-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CRM branch
        uses: actions/checkout@v4
        with:
          ref: feature/crm-on-current-main-20261121
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate timestamped migration using Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          before="$(find supabase/migrations -maxdepth 1 -type f -name '*_admin_crm_private_rpc_facades.sql' -print)"
          if [[ -n "$before" ]]; then
            echo "A generated CRM facade migration already exists; refusing to create another."
            exit 1
          fi
          supabase migration new admin_crm_private_rpc_facades
          mapfile -t generated < <(find supabase/migrations -maxdepth 1 -type f -name '*_admin_crm_private_rpc_facades.sql' -print)
          if [[ "${#generated[@]}" -ne 1 ]]; then
            echo "Expected exactly one CLI-generated migration file."
            exit 1
          fi
          cat > "${generated[0]}" <<'SQL'
          -- Timestamp generated by Supabase CLI.
          -- Content will be added only after review; this file does not apply itself.
          SQL
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${generated[0]}"
          git commit -m "chore(db): generate timestamped CRM migration file"
          git push origin HEAD:feature/crm-on-current-main-20261121
