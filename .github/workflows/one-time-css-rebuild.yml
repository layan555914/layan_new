name: One-time CSS bundle rebuild

on:
  push:
    branches:
      - fix/main-css-ci-20261128
    paths:
      - .github/workflows/one-time-css-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/main-css-ci-20261128
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the exact CSS builder
        run: npm install --no-save --no-package-lock lightningcss@1.30.1
      - name: Rebuild CSS using the repository script
        run: node scripts/build-css.mjs
      - name: Commit generated assets only
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild generated CSS bundles"
          git push origin HEAD:fix/main-css-ci-20261128
